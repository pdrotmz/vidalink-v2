spring:
  application:
    name: vidalink

server:
  port: 8080

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:vidalink
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate: create-drop
    show-sql: true
jwt:
